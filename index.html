<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanriobooth 🎀</title>

<style>

/* ========================================
   BASIC
======================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;

    font-family:
    "Trebuchet MS",
    "Arial Rounded MT Bold",
    Arial,
    sans-serif;

    background:#bde9ff;
}


/* ========================================
   SCREEN
======================================== */

.screen{
    position:absolute;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;

    overflow:hidden;
}

.screen.active{
    display:flex;
}


/* ========================================
   BACKGROUND
======================================== */

.background{
    position:absolute;

    inset:-3%;

    width:106%;
    height:106%;

    object-fit:cover;

    z-index:-5;

    animation:
    backgroundZoom 12s ease-in-out infinite alternate;
}


.overlay{
    position:absolute;

    inset:0;

    z-index:-4;

    background:
    linear-gradient(
        135deg,
        rgba(102,211,255,.48),
        rgba(255,151,205,.48)
    );
}


/* soft glowing circles */

.glow-one,
.glow-two{
    position:absolute;

    border-radius:50%;

    z-index:-3;

    pointer-events:none;

    filter:blur(5px);
}

.glow-one{
    width:280px;
    height:280px;

    top:-80px;
    left:-80px;

    background:
    rgba(255,255,255,.35);

    animation:
    glowMoveOne 8s ease-in-out infinite alternate;
}

.glow-two{
    width:300px;
    height:300px;

    right:-100px;
    bottom:-100px;

    background:
    rgba(255,180,220,.32);

    animation:
    glowMoveTwo 9s ease-in-out infinite alternate;
}


/* ========================================
   GLASS CARD
======================================== */

.card{
    width:min(94vw,500px);

    padding:25px 22px 32px;

    border-radius:38px;

    background:
    rgba(255,255,255,.48);

    backdrop-filter:blur(13px);

    -webkit-backdrop-filter:blur(13px);

    border:3px solid rgba(255,255,255,.9);

    box-shadow:
    0 20px 60px
    rgba(55,125,165,.30),

    inset 0 0 25px
    rgba(255,255,255,.45);
}


/* ========================================
   WELCOME PHOTO
======================================== */

.welcome-photo-frame{

    width:min(78vw,350px);
    height:min(78vw,350px);

    margin:auto;

    padding:10px;

    background:white;

    border-radius:32px;

    border:3px solid #ffd3e6;

    box-shadow:

    0 0 0 6px
    rgba(255,255,255,.7),

    0 18px 45px
    rgba(50,110,150,.35);

    animation:
    welcomePhotoIn 1.4s ease,
    welcomeFloat 4s ease-in-out 1.4s infinite;
}


.welcome-photo-frame img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:23px;
}


/* ========================================
   BRAND
======================================== */

.brand{

    margin-top:20px;

    color:#438fbe;

    font-size:25px;

    font-weight:1000;

    letter-spacing:6px;

    text-shadow:
    2px 2px 0 white,
    0 0 12px rgba(255,255,255,.8);

    animation:
    brandIn 1.5s ease;
}


/* ========================================
   WELCOME TEXT
======================================== */

.welcome-title{

    margin-top:8px;

    color:white;

    font-size:clamp(43px,11vw,62px);

    font-weight:1000;

    letter-spacing:7px;

    line-height:1;

    text-shadow:

    0 4px 0 #e979a7,

    0 7px 15px
    rgba(150,80,110,.25),

    0 0 22px white,

    0 0 40px #ff9bc7;

    animation:
    welcomeTextIn 1.4s cubic-bezier(.17,.67,.25,1.3);
}


.welcome-sub{

    margin-top:15px;

    color:white;

    font-size:17px;

    font-weight:900;

    letter-spacing:1.5px;

    text-shadow:
    0 2px 6px rgba(80,100,120,.3);

    animation:
    subIn 1.8s ease;
}


/* ========================================
   BUTTON
======================================== */

.main-button{

    margin-top:28px;

    padding:15px 34px;

    min-width:190px;

    border-radius:50px;

    border:3px solid white;

    background:
    linear-gradient(
        135deg,
        #72d4ff 0%,
        #9fceff 45%,
        #ff8fbd 100%
    );

    color:white;

    font-size:17px;

    font-weight:1000;

    letter-spacing:1.5px;

    cursor:pointer;

    box-shadow:

    0 9px 25px
    rgba(60,130,175,.30),

    inset 0 2px 5px
    rgba(255,255,255,.55);

    transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.main-button:hover{

    transform:
    translateY(-3px)
    scale(1.05);

    box-shadow:

    0 13px 30px
    rgba(60,130,175,.38),

    inset 0 2px 5px
    rgba(255,255,255,.65);
}

.main-button:active{

    transform:scale(.95);

}


/* ========================================
   THANK YOU PHOTO
======================================== */

.thank-photo-frame{

    width:min(80vw,360px);
    height:min(80vw,360px);

    margin:auto;

    padding:10px;

    background:white;

    border-radius:32px;

    border:3px solid #ffd1e4;

    box-shadow:

    0 0 0 6px
    rgba(255,255,255,.65),

    0 18px 45px
    rgba(50,110,150,.35);

    animation:
    thankPhotoIn 1.5s cubic-bezier(.17,.67,.25,1.3),
    thankFloat 4s ease-in-out 1.5s infinite;
}


.thank-photo-frame img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:23px;
}


/* ========================================
   THANK YOU TEXT
======================================== */

.thank-brand{

    margin-top:18px;

    color:#438fbe;

    font-size:23px;

    font-weight:1000;

    letter-spacing:5px;

    text-shadow:
    2px 2px white;

    animation:
    thankBrandIn 1.5s ease;
}


.thank-title{

    margin-top:7px;

    color:white;

    font-size:clamp(42px,11vw,59px);

    font-weight:1000;

    letter-spacing:4px;

    line-height:1;

    text-shadow:

    0 4px 0 #e879a7,

    0 7px 15px
    rgba(130,70,100,.25),

    0 0 20px white,

    0 0 40px #ff91c0;

    animation:
    thankTextIn 1.5s cubic-bezier(.17,.67,.25,1.3);
}


.thank-message{

    margin-top:14px;

    color:white;

    font-size:16px;

    line-height:1.6;

    font-weight:900;

    letter-spacing:.7px;

    text-shadow:
    0 2px 6px rgba(80,100,120,.3);

    animation:
    messageIn 2s ease;
}


/* ========================================
   FLOATING HEARTS
======================================== */

.heart{

    position:absolute;

    color:white;

    font-size:32px;

    font-weight:bold;

    opacity:0;

    z-index:1;

    pointer-events:none;

    animation:
    heartRise 4.5s ease-in-out infinite;
}

.heart1{
    left:12%;
    bottom:10%;
}

.heart2{
    right:12%;
    bottom:18%;
    animation-delay:1s;
}

.heart3{
    left:18%;
    top:20%;
    animation-delay:2s;
}

.heart4{
    right:18%;
    top:25%;
    animation-delay:3s;
}


/* ========================================
   ANIMATIONS
======================================== */

@keyframes backgroundZoom{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.07);
    }
}


@keyframes glowMoveOne{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(180px,130px);
    }
}


@keyframes glowMoveTwo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-150px,-120px);
    }
}


/* Welcome card */

@keyframes welcomeCardIn{

    from{
        opacity:0;
        transform:
        scale(.65)
        translateY(50px);
    }

    to{
        opacity:1;
        transform:
        scale(1)
        translateY(0);
    }
}


/* Welcome photo */

@keyframes welcomePhotoIn{

    from{
        opacity:0;

        transform:
        scale(.45)
        rotate(-12deg);
    }

    to{
        opacity:1;

        transform:
        scale(1)
        rotate(0);
    }
}


@keyframes welcomeFloat{

    0%,100%{
        transform:
        translateY(0)
        rotate(-1deg);
    }

    50%{
        transform:
        translateY(-10px)
        rotate(1deg);
    }
}


/* Brand */

@keyframes brandIn{

    from{
        opacity:0;

        letter-spacing:18px;
    }

    to{
        opacity:1;

        letter-spacing:6px;
    }
}


/* Welcome */

@keyframes welcomeTextIn{

    0%{
        opacity:0;

        transform:
        scale(.25)
        rotate(-8deg);
    }

    70%{
        transform:
        scale(1.12)
        rotate(2deg);
    }

    100%{
        opacity:1;

        transform:
        scale(1)
        rotate(0);
    }
}


@keyframes subIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* Thank photo */

@keyframes thankPhotoIn{

    from{
        opacity:0;

        transform:
        scale(.45)
        translateY(-100px)
        rotate(12deg);
    }

    to{
        opacity:1;

        transform:
        scale(1)
        translateY(0)
        rotate(0);
    }
}


@keyframes thankFloat{

    0%,100%{
        transform:
        translateY(0)
        rotate(-1deg);
    }

    50%{
        transform:
        translateY(-9px)
        rotate(1deg);
    }
}


/* Thank brand */

@keyframes thankBrandIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* Thank title */

@keyframes thankTextIn{

    0%{
        opacity:0;

        transform:
        scale(.2)
        rotate(-10deg);
    }

    65%{
        transform:
        scale(1.12)
        rotate(2deg);
    }

    100%{
        opacity:1;

        transform:
        scale(1)
        rotate(0);
    }
}


@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* Hearts */

@keyframes heartRise{

    0%{
        opacity:0;

        transform:
        translateY(35px)
        scale(.5);
    }

    25%{
        opacity:.9;
    }

    100%{
        opacity:0;

        transform:
        translateY(-120px)
        scale(1.25)
        rotate(12deg);
    }
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:500px){

    .card{

        width:94vw;

        padding:
        20px 15px 25px;

    }


    .welcome-photo-frame{

        width:72vw;
        height:72vw;

        max-width:310px;
        max-height:310px;

    }


    .thank-photo-frame{

        width:74vw;
        height:74vw;

        max-width:320px;
        max-height:320px;

    }


    .brand{

        font-size:20px;

    }


    .welcome-sub{

        font-size:14px;

    }


    .thank-message{

        font-size:14px;

    }


    .main-button{

        padding:
        13px 28px;

        font-size:15px;

    }

}

</style>
</head>


<body>


<!-- ==================================================
     WELCOME SCREEN
================================================== -->

<section
    id="welcomeScreen"
    class="screen active">


    <img
        src="vintage.png"
        class="background"
        alt=""
    >

    <div class="overlay"></div>

    <div class="glow-one"></div>

    <div class="glow-two"></div>


    <div
        class="card"
        style="animation:welcomeCardIn 1s ease;">


        <!-- 1st / PHOTO BOOTH IMAGE -->

        <div class="welcome-photo-frame">

            <img
                src="photo-booth.jpg"
                alt="Sanriobooth"
            >

        </div>


        <div class="brand">

            SANRIOBOOTH

        </div>


        <h1 class="welcome-title">

            WELCOME

        </h1>


        <p class="welcome-sub">

            ✨ Let's make a cute memory together ✨

        </p>


        <button
            class="main-button"
            onclick="showThankYou()">

            🎀 START 🎀

        </button>


    </div>

</section>



<!-- ==================================================
     THANK YOU SCREEN
================================================== -->

<section
    id="thankScreen"
    class="screen">


    <img
        src="vintage.png"
        class="background"
        alt=""
    >

    <div class="overlay"></div>

    <div class="glow-one"></div>

    <div class="glow-two"></div>


    <!-- Floating hearts -->

    <span class="heart heart1">♡</span>

    <span class="heart heart2">♡</span>

    <span class="heart heart3">♡</span>

    <span class="heart heart4">♡</span>


    <div
        class="card"
        style="animation:welcomeCardIn 1s ease;">


        <!-- HANDS JOINED PHOTO -->

        <div class="thank-photo-frame">

            <img
                src="thank-you.jpg"
                alt="Thank You"
            >

        </div>


        <div class="thank-brand">

            SANRIOBOOTH

        </div>


        <h1 class="thank-title">

            THANK YOU ♡

        </h1>


        <p class="thank-message">

            Thank you for visiting
            <br>

            our little photo booth ✨

            <br>

            Hope you had a lovely time 🎀

        </p>


        <button
            class="main-button"
            onclick="startAgain()">

            🔄 START AGAIN

        </button>


    </div>

</section>



<script>

/* ==========================================
   WELCOME → THANK YOU
========================================== */

function showThankYou(){

    const welcome =
    document.getElementById("welcomeScreen");

    const thank =
    document.getElementById("thankScreen");


    welcome.classList.remove("active");

    thank.classList.add("active");

}


/* ==========================================
   START AGAIN
========================================== */

function startAgain(){

    const welcome =
    document.getElementById("welcomeScreen");

    const thank =
    document.getElementById("thankScreen");


    thank.classList.remove("active");

    welcome.classList.add("active");

}

</script>

</body>
</html>
